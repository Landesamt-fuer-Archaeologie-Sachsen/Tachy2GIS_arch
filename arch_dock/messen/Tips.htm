<!DOCTYPE html>
<html lang="de">
<head>
  <meta http-equiv="content-type" content="text/html; charset=utf-8">
  <style type="text/css">
    body {
      font-family: Arial, sans-serif;
      font-size: 13px;
      background-color: #f5f5f5;
      color: #2c2c2c;
      margin: 12px;
      padding: 0;
    }
    h1 {
      font-size: 15px;
      font-weight: bold;
      color: #1a1a2e;
      border-bottom: 2px solid #4a90a4;
      padding-bottom: 6px;
      margin-bottom: 12px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      background-color: #ffffff;
      border-radius: 4px;
    }
    th {
      background-color: #4a90a4;
      color: #ffffff;
      font-weight: bold;
      padding: 7px 10px;
      text-align: left;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    td {
      padding: 6px 10px;
      border-bottom: 1px solid #e0e0e0;
      vertical-align: middle;
    }
    tr:last-child td {
      border-bottom: none;
    }
    tr:nth-child(even) td {
      background-color: #f0f7fa;
    }
    td:first-child {
      font-family: monospace;
      font-size: 12px;
      font-weight: bold;
      color: #4a90a4;
      white-space: nowrap;
      width: 40%;
    }
  </style>
</head>
<body>
  <table>
    <tr>
      <th>Tasten</th>
      <th>Befehl</th>
    </tr>
    <tr>
      <td>Enter / Return</td>
      <td>Geometrie erzeugen.</td>
    </tr>
    <tr>
      <td>Shift + L</td>
      <td>Koordinatentabelle l&ouml;schen.</td>
    </tr>
    <tr>
      <td>Shift + Z</td>
      <td>Zur&uuml;ck. L&ouml;scht die letzte Koordinate.</td>
    </tr>
    <tr>
      <td>Shift + K</td>
      <td>Register Koordinaten aufrufen.</td>
    </tr>
    <tr>
      <td>Shift + A</td>
      <td>Register Attribute aufrufen.</td>
    </tr>
    <tr>
      <td>Shift + M</td>
      <td>Register Messungen aufrufen.</td>
    </tr>
  </table>
</body>
</html>
